name: Tests

# Mirrors the trigger pattern of another_agent_backend + frontend:
# fires on PR to dev, skips when only docs changed. Keeps GitHub
# Actions minutes off pure-markdown PRs (typo fixes, README tweaks).
"on":
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache pip's wheel directory keyed on the project metadata.
          # pyproject.toml is the single source of truth for runtime +
          # dev dependencies (replaced requirements*.txt). Saves ~30s
          # on every run after the first.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install with the [dev] extras — gives us pytest,
          # pytest-cov, httpx alongside the runtime deps.
          pip install -e ".[dev]"

      - name: Run tests + coverage gate
        # pytest.ini wires --cov + --cov-fail-under=70 into addopts,
        # so the gate fires automatically. A regression below 70%
        # source coverage will fail the job.
        run: pytest

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # .coverage is the raw data file; useful for re-running
          # `coverage report` locally on a maintainer's machine.
          path: .coverage
          retention-days: 7
