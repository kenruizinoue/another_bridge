[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Add the repo root to sys.path so tests can import top-level modules
# (config, jobs) and the routers package without an editable install.
pythonpath = .

# Coverage gate. Measures the source tree (config, jobs, auth, main,
# routers/, services/) — explicitly excluding tests/ itself so the
# number reflects production-code coverage, not test self-coverage.
# fail_under=70 is the contractual floor; the repo is currently
# ~90%, but the gate catches a regression that drops us below the
# bar without a full review.
#
# To iterate without the gate firing on every run:
#   pytest --no-cov
addopts =
    --cov=auth
    --cov=config
    --cov=jobs
    --cov=main
    --cov=routers
    --cov=services
    --cov-report=term-missing
    --cov-fail-under=70
