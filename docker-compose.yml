# Production-ish docker-compose for `another_coder`. For laptop dev
# use the venv path in the README — Docker is for VPS / home-server
# deployments where you want one-command install + a persistent
# session DB without root-installing Python or Node.
#
# Required env (put in `.env` next to this file, then `docker compose up`):
#
#   ANOTHER_CODER_API_KEY    — generate with
#       python -c "import secrets; print(secrets.token_urlsafe(32))"
#   GITHUB_PAT               — for the planning + implementation tools
#   GITHUB_DEFAULT_REPO      — owner/repo
#
# Optional env: see .env.example for the full list (rate-limit specs,
# reaper tunables, base branch, etc.).

services:
  another_coder:
    build:
      context: .
      dockerfile: Dockerfile
    image: another_coder:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The session DB has no host equivalent (it lives in a named
      # volume), so its container-internal path stays overridden here.
      # WORKSPACE_ROOT is intentionally NOT overridden — it comes
      # straight from .env, which the 1:1 bind mount below makes
      # work identically inside and outside the container.
      ANOTHER_CODER_SESSION_DB_PATH: /data/sessions.db
      # Claude refuses --dangerously-skip-permissions when EUID==0
      # unless IS_SANDBOX=1 signals "yes, this IS a controlled
      # container — that's the whole point of running here." The
      # bridge always passes the flag (headless spawns can't approve
      # permission prompts), so without this the chat path fails
      # immediately with a non-actionable error.
      IS_SANDBOX: "1"
    volumes:
      # Workspace — bind-mounted 1:1 so the same path that exists
      # on your host also resolves inside the container. Compose
      # reads WORKSPACE_ROOT directly from .env (same value the
      # bridge uses for path validation), so there's a single
      # source of truth and no host/container path translation.
      - ${WORKSPACE_ROOT:-${HOME}/Projects}:${WORKSPACE_ROOT:-${HOME}/Projects}:rw
      # claude CLI auth lives in TWO places on the host:
      #   - $HOME/.claude/        — the directory (caches, projects)
      #   - $HOME/.claude.json    — the top-level config + session token
      # Both must be mounted; missing the second one produces
      # "Claude configuration file not found at /root/.claude.json"
      # because the file is at the parent of $HOME/.claude/, not
      # inside it.
      - ${HOST_CLAUDE_DIR:-${HOME}/.claude}:/root/.claude:rw
      - ${HOST_CLAUDE_CONFIG:-${HOME}/.claude.json}:/root/.claude.json:rw
      # Persistent session DB. Named volume (rather than bind mount)
      # because the path is internal to the container.
      - sessions:/data
    healthcheck:
      # Hit the unauthed /health endpoint. Cheap, doesn't require
      # the API key.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sessions:
